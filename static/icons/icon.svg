<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4" />

  <!-- Open Book Graphic -->
  <g transform="translate(96, 120)" fill="none" stroke="url(#pageGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Spine -->
    <line x1="160" y1="50" x2="160" y2="230" />
    <!-- Left Page -->
    <path d="M160 50 C110 32 40 38 10 54 L10 234 C40 218 110 212 160 230" />
    <!-- Right Page -->
    <path d="M160 50 C210 32 280 38 310 54 L310 234 C280 218 210 212 160 230" />
    <!-- Left text lines -->
    <line x1="45" y1="100" x2="125" y2="92" stroke-width="14" stroke="#94a3b8" />
    <line x1="45" y1="140" x2="125" y2="132" stroke-width="14" stroke="#94a3b8" />
    <line x1="45" y1="180" x2="105" y2="174" stroke-width="14" stroke="#94a3b8" />
    <!-- Right text lines -->
    <line x1="195" y1="92" x2="275" y2="100" stroke-width="14" stroke="#94a3b8" />
    <line x1="195" y1="132" x2="275" y2="140" stroke-width="14" stroke="#94a3b8" />
    <line x1="195" y1="174" x2="255" y2="180" stroke-width="14" stroke="#94a3b8" />
  </g>
</svg>
