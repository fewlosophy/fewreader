description = "北宋沈括所著筆記，二十六卷，分故事、辯證、樂律、象數、人事、官政、權智、藝文、書畫、技藝、器用、神奇、異事、謬誤、譏謔、雜誌、藥議十七門，另附補筆談、續筆談。"
