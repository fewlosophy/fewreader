[[book]]
slug = "republic"
title = "The Republic"
category = "philosophy"
book_file = "The Republic"
lang = "en"
source = "gutenberg"
source_url = "https://www.gutenberg.org/cache/epub/150/pg150.txt"
chapter_re = "^BOOK\\s+[IVXLC]+$"
chapter_total = 10
author = "Plato"
translator = "B. Jowett"
year = 380
license = "Public domain (US) / Project Gutenberg transcriber terms"
pd_basis = "Plato (d. 348 BCE) and Jowett's 1871 translation are public domain; the Gutenberg transcribed text is redistributed without its header per the Gutenberg trademark terms."
description = "Plato's dialogue on justice and the ideal state."
min_chars = 5000
max_chars = 400000

[[book]]
slug = "meng-xi-bi-tan"
title = "夢溪筆談"
category = "notes"
book_file = "夢溪筆談"
lang = "zh"
source = "wikisource"
source_id = "夢溪筆談"
chapter_total = 26
unit = "卷"
page_pattern = "卷{n:02d}"
profile = "wikisource-header"
index_note = "二十六卷 · 附補筆談、續筆談"
