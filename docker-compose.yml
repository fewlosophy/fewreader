services:
  fewreader:
    build:
      context: .
      dockerfile: Dockerfile
    image: fewreader:latest
    container_name: fewreader
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - CONTENT_DIR=/app/content
      - APP_TITLE=Fewreader
    volumes:
      # Mount local content folder as read-only
      - ./content:/app/content:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
